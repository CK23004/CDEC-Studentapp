# -----------------------------------------------------------------------------
# Backend Service
# -----------------------------------------------------------------------------
# ClusterIP is used because the backend should only be reachable from inside
# the cluster (and externally ONLY via the Ingress). No NodePort/LoadBalancer.
# The Ingress routes /api traffic to this Service on port 5005.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: default
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend          # Must match the backend Pod label
  ports:
    - port: 5005
      targetPort: 5005

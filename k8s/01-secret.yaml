# -----------------------------------------------------------------------------
# MySQL Secret
# -----------------------------------------------------------------------------
# A Secret stores sensitive data (passwords) separately from Deployments/
# StatefulSets. This keeps credentials OUT of your manifests and lets the same
# values be reused by both the MySQL StatefulSet and the Backend Deployment.
#
# stringData lets you write plain text values; Kubernetes base64-encodes them
# for you when stored. In production you'd manage these with a secrets manager.
#
# Values here are aligned with backend/.env (DB_USER=root, DB_PASSWORD=root,
# DB_NAME=student_db).
#
# NOTE: The Flask app connects as DB_USER and runs "CREATE DATABASE IF NOT
# EXISTS", which the non-root MYSQL_USER cannot do. So the backend uses the
# ROOT account: DB_USER=root and DB_PASSWORD -> MYSQL_ROOT_PASSWORD.
#
# >>> REPLACE the passwords below with strong values before production. <<<
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: default
type: Opaque
stringData:
  # Consumed by the mysql:8.0 image on first boot to initialize the DB.
  MYSQL_DATABASE: student_db
  MYSQL_USER: appuser
  MYSQL_PASSWORD: root          # <-- REPLACE for production
  MYSQL_ROOT_PASSWORD: root     # <-- REPLACE for production

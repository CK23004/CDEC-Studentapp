
services:
  mysql:
    image: mysql
    container_name: studentapp_db
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=student_db
    ports:
      - 3306:3306
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      
  backend:
    build: backend/.
    container_name: studentapp_backend
    restart: unless-stopped
    env_file:
      - backend/.env
    ports:
      - 5005:5005
    networks:
      - backend-net
      - frontend-net
    depends_on:
      mysql:
        condition: service_healthy
    
  frontend:
    build: frontend/.
    container_name: studentapp_frontend
    restart: unless-stopped
    env_file:
      - frontend/.env
    ports:
      - 3000:80
    networks:
      - frontend-net
    depends_on:
      backend:
        condition: service_started
    

networks:
  backend-net:
    driver: bridge
  frontend-net:
    driver: bridge

volumes:
  mysql_data:
    driver: local

